version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gomycode/deployment-checkpoint:latest
    container_name: gomycode_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017/deployment_db
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:7.0-jammy
    container_name: gomycode_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
